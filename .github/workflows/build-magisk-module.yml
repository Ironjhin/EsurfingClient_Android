name: Build Magisk Module

on:
  push:
    branches:
      - magisk
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.claude/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      esurfing_version: ${{ steps.version.outputs.esurfing_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build zip unzip

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: magisk/.ndk
          key: ndk-r27c

      - name: Build daemon binary
        run: |
          cd magisk
          bash build.sh

      - name: Build WebView APK (optional)
        continue-on-error: true
        run: |
          echo "=== Setting up Android SDK for APK build ==="
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "SDK platform 34 not found, trying to install..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          fi

          echo "=== Downloading Gradle ==="
          cd magisk
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip

          # 生成 local.properties 指向 Android SDK（独立作用于 app 子工程）
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties

          echo "=== Building APK ==="
          (cd app && ../gradle-8.4/bin/gradle -c settings.gradle assembleDebug --no-daemon) 2>&1 || {
            echo "APK build failed (non-fatal)"
            rm -f app/local.properties
            exit 0
          }
          rm -f app/local.properties
          ls -la app/build/outputs/apk/debug/ 2>/dev/null && echo "APK build SUCCESS" || echo "No APK output found"

      - name: Package module
        id: version
        run: |
          MODULE_DIR="magisk/module"

          # 从 magisk/CMakeLists.txt 提取 C 核心引擎版本号（如 2.3.1-r5）
          V_MAJ=$(awk '/^set\(PROGRAM_VERSION_MAJOR / {gsub(/\)/,"",$2); print $2}' magisk/CMakeLists.txt)
          V_MIN=$(awk '/^set\(PROGRAM_VERSION_MINOR / {gsub(/\)/,"",$2); print $2}' magisk/CMakeLists.txt)
          V_PAT=$(awk '/^set\(PROGRAM_VERSION_PATCH / {gsub(/\)/,"",$2); print $2}' magisk/CMakeLists.txt)
          V_REL=$(awk '/^set\(PROGRAM_VERSION_RELEASE / {gsub(/\)/,"",$2); print $2}' magisk/CMakeLists.txt)
          CORE_VER="${V_MAJ}.${V_MIN}.${V_PAT}-r${V_REL}"

          # 自动生成唯一版本号，避免 tag 冲突
          # 版本号格式: 1.1.{run_number}，确保每次构建都递增
          AUTO_VERSION="1.1.${{ github.run_number }}"
          AUTO_VERSION_CODE="${{ github.run_number }}"

          # 覆写 module.prop 中的版本号（附带核心引擎版本标识）
          sed -i "s/^version=.*/version=${AUTO_VERSION} (v${CORE_VER})/" "$MODULE_DIR/module.prop"
          sed -i "s/^versionCode=.*/versionCode=${AUTO_VERSION_CODE}/" "$MODULE_DIR/module.prop"

          echo "AUTO_VERSION=$AUTO_VERSION (v$CORE_VER)"
          echo "AUTO_VERSION_CODE=$AUTO_VERSION_CODE"
          echo "Updated module.prop:"
          cat "$MODULE_DIR/module.prop"

          # 校验二进制、Portal 完整静态资源（含 assets）及 KernelSU WebUI 均存在
          if [ ! -f "$MODULE_DIR/esurfingd" ]; then
            echo "ERROR: daemon binary missing at $MODULE_DIR/esurfingd" >&2
            exit 1
          fi
          if [ ! -f "$MODULE_DIR/portal/index.html" ] || [ ! -f "$MODULE_DIR/portal/assets/js/main.js" ]; then
            echo "ERROR: portal static assets incomplete at $MODULE_DIR/portal/" >&2
            exit 1
          fi
          if [ ! -f "$MODULE_DIR/webroot/index.html" ]; then
            echo "ERROR: KernelSU WebUI missing at $MODULE_DIR/webroot/index.html" >&2
            exit 1
          fi
          echo "Binary, Portal assets & KernelSU WebUI verified OK"

          # Inject WebView APK if built (clean empty system/ dir otherwise)
          if [ -f magisk/app/build/outputs/apk/debug/app-debug.apk ]; then
            mkdir -p "$MODULE_DIR/system/app/ESurfingUI"
            cp -f magisk/app/build/outputs/apk/debug/app-debug.apk "$MODULE_DIR/system/app/ESurfingUI/"
            echo "WebView APK included"
          else
            rm -rf "$MODULE_DIR/system"
            echo "No WebView APK — module will use browser / KernelSU WebUI"
          fi

          # Ensure clean Unix permissions before artifact upload
          find "$MODULE_DIR/portal" "$MODULE_DIR/webroot" -type d -exec chmod 755 {} +
          find "$MODULE_DIR/portal" "$MODULE_DIR/webroot" -type f -exec chmod 644 {} +
          chmod 644 "$MODULE_DIR/module.prop" "$MODULE_DIR/ESurfingClient.json"
          chmod 755 "$MODULE_DIR/esurfingd" "$MODULE_DIR/service.sh" "$MODULE_DIR/action.sh" "$MODULE_DIR/customize.sh" "$MODULE_DIR/uninstall.sh"

          # Create final module zip
          mkdir -p magisk/output
          cd "$MODULE_DIR"
          zip -r9 "$GITHUB_WORKSPACE/magisk/output/esurfing-daemon-arm64-v8a.zip" . -x ".*" "*/.*" "*.md"
          ls -la "$GITHUB_WORKSPACE/magisk/output/"

          # 把版本号传给后续 step 和 job
          echo "ESURFING_VERSION=$AUTO_VERSION" >> "$GITHUB_ENV"
          echo "esurfing_version=$AUTO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload module dir
        uses: actions/upload-artifact@v4
        with:
          name: module-dir
          path: magisk/module/

  create-release:
    needs: build
    if: github.ref == 'refs/heads/magisk'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download module dir
        uses: actions/download-artifact@v4
        with:
          name: module-dir
          path: module-dir

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.esurfing_version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION is empty!" >&2
            exit 1
          fi

          TAG_NAME="magisk-$VERSION"
          ZIP_NAME="esurfing-daemon-arm64-v8a.zip"

          echo "Release version: $VERSION"
          echo "Tag name: $TAG_NAME"

          # download-artifact@v4 会剥离可执行权限位，打包前显式恢复 Unix 权限
          cd module-dir
          find portal webroot -type d -exec chmod 755 {} +
          find portal webroot -type f -exec chmod 644 {} +
          chmod 644 module.prop ESurfingClient.json
          chmod 755 esurfingd service.sh action.sh customize.sh uninstall.sh

          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x ".*" "*/.*" "*.md"
          cd "$GITHUB_WORKSPACE"
          mkdir -p release
          mv "$ZIP_NAME" release/
          echo "Release zip: $(ls -lh release/)"

          printf '%s\n' \
            '## 🔌 ESurfing Daemon — Magisk / KernelSU / APatch 守护模块' \
            '纯 C 原生守护进程（~1-2MB），支持开机自启、7×24 小时息屏保活与透明代理共存。' \
            '' \
            '> 📱 **无 Root 安卓设备用户**：请前往安生同学维护的开源纯 C 安卓客户端项目下载免 Root APK：' \
            '> [👉 ESurfingClient-CVersion-Android-APK](https://github.com/anshenglv/ESurfingClient-CVersion-Android-APK)' \
            '' \
            '---' \
            '' \
            "### ✨ 本次更新 ($VERSION / Core v2.3.1-r5)" \
            '' \
            '#### 1. 同步上游核心 (`v2.2.0-r5` → `v2.3.1-r5`)' \
            '- **认证防风控保护**：连续两次 `302` 二次确认才触发重认证（防网关抖动误踢）；60 秒内登录满 2 次暂停认证 35 分钟、常规退避尾档调至 35 分钟（避开 30 分钟整点锁定）' \
            '- **心跳保活增强**：区分网络不通 (`HB_NET_FAIL`) 与服务端拒绝 (`HB_PROTO_FAIL`)，按 `1/2/4/8/16/30s` 指数退避重试；纯网络波动不盲目退登，服务端踢下线立即重认证' \
            '- **自定义联网探测 (`probe_hosts`)**：支持最多 14 路固定 IPv4 并发探测，缺失自动补全写回配置，双端 Web 支持可视化编辑' \
            '- **单实例锁与路由标记**：新增 `main` / `web` / `auth-N` 文件锁防双开互踢；`work_auth` 主线程绑定 `SO_MARK` 失败即关闭 socket 放弃请求防串线' \
            '- **配置热重载与内核重构**：保存与应用基于 `.apply` 解耦、状态收拢至 `States` (`cfg_t`)、日志等级 `VERBOSE` 更名为 `TRACE`' \
            '' \
            '#### 2. Magisk / KernelSU 模块升级与全量 Bug 修复' \
            '- **多维日志轮转淘汰与原位安全清理 (`v1.1.73`)**：新增 `log_max_files`（默认 `5`，`0..100`）、`log_max_days`（默认 `3`，`0..365`）与 `10 MB` 总归档兜底上限（`lstat` 精准过滤、未同步 NTP 防护），默认日志等级优化为 `INFO (4)`；新增 `POST /api/logs/clear` 支持原位 `truncate` 安全清空 `run.log`（保持多进程 `O_APPEND` 句柄不断裂）' \
            '- **KernelSU WebUI & Portal 双端升级**：全新响应式 Bento WebUI 新增实时日志存储统计徽章、原生 `<dialog>` 模态清理确认弹窗与 `log_max_files`/`log_max_days` 高级配置（100% 离线零外链）；8888 原生 Portal 同步补齐归档策略字段校验与「清理日志」入口' \
            '- **Android / 校园网防坑适配**：默认锁定 `android` (通道 `3`) 规避高校 Windows 通道登录超时；单实例锁路径适配至 `/data/adb/esurfing/`；保持 `GID 3005` (`AID_NET_ADMIN`) 透明代理直连豁免' \
            '- **守护稳定性与安全修复**：修复查询/重复启动误删 `esurfingd.pid` 与停止后 `wake_lock` 未释放问题；全链路切换 `CLOCK_MONOTONIC` 单调时钟；修复 `SIGUSR1` 信号安全、`WebLogFiles` 内存安全、禁用配置热重载死锁、`/api/restart` 端口冲突与 `bootId` 检测；修复 `build.sh`/`service.sh`/`action.sh`/`uninstall.sh` 及 WebView APK 明文 HTTP 加载 (`usesCleartextTraffic="true"`)' \
            '' \
            '### 📦 安装说明' \
            '1. 下载下方 `esurfing-daemon-arm64-v8a.zip`' \
            '2. 打开 **Magisk / KernelSU / APatch** 管理器 → 模块 → 从本地安装' \
            '3. 重启设备（或在 KernelSU / APatch 中点击模块的 **Action / 执行** 按钮立即启动）' \
            '' \
            '### 🌐 Web 管理后台' \
            '- **浏览器 / 桌面图标**：点击桌面 `ESurfing` 应用，或手机浏览器直接访问 `http://127.0.0.1:8888/`' \
            '- **KernelSU / APatch**：管理器 → 模块 → `ESurfing Daemon` → 点击 **WebUI**' \
            '- **配置文件与日志路径**：`/data/adb/esurfing/ESurfingClient.json`、`/data/adb/esurfing/run.log`' \
            > /tmp/release-notes.md

          gh release create "$TAG_NAME" \
            release/*.zip \
            --title "🔌 ESurfing Daemon $TAG_NAME (Core v2.3.1-r5)" \
            --notes-file /tmp/release-notes.md
